# =====================================================================
# CREDPAY - pull request validation
# =====================================================================
# Runs for every pull request into main (set up as a branch policy:
# Repos -> Branches -> main -> Branch policies -> Build validation ->
# this pipeline). The PR cannot be completed unless it passes.
#
#   gitleaks · Trivy filesystem · per changed service:
#   tests -> docker build -> Trivy image gate        (nothing is pushed)
#
# SonarQube is not run here: SonarQube Community Edition analyses only
# the main branch, so the quality gate is enforced by pipelines/credpay-ci.yml.
# =====================================================================

trigger: none   # started by the branch policy, not by pushes
pr: none        # (the pr: keyword is for GitHub; Azure Repos uses branch policies)

parameters:
  - name: buildAll
    displayName: Build all services (ignore change detection)
    type: boolean
    default: false

variables:
  - template: templates/variables.yml

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Prepare
    displayName: Security scans and change detection
    jobs:
      - template: templates/security-scans.yml
      - template: templates/detect-changes.yml
        parameters:
          buildAll: ${{ parameters.buildAll }}

  - stage: Build
    displayName: Test, build and scan (no push)
    dependsOn: Prepare
    jobs:
      - template: templates/build-service.yml
        parameters:
          service: user-service
          language: java

      - template: templates/build-service.yml
        parameters:
          service: payment-service
          language: python

      - template: templates/build-service.yml
        parameters:
          service: customer-portal
          language: node

      - template: templates/build-service.yml
        parameters:
          service: admin-portal
          language: node

      - template: templates/build-service.yml
        parameters:
          service: keycloak
          path: infra/keycloak
          language: none

      - template: templates/build-service.yml
        parameters:
          service: ai-service
          language: python
