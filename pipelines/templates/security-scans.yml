# =====================================================================
# Repository-wide security scans (run before anything is built)
#
#  1. gitleaks - secrets anywhere in the git history. BLOCKING.
#  2. Trivy filesystem - vulnerable dependencies and misconfigurations in
#     Dockerfiles, the Helm chart, Kubernetes and Terraform files. REPORT
#     ONLY: review the first reports on the Helm chart and platform files,
#     then make it blocking.
#
# Reports are published as pipeline artifacts (Summary -> Published):
#   gitleaks-report   gitleaks.sarif
#   trivy-fs-report   trivy-fs.json / .html / .txt / -junit.xml
# A re-run of a failed job adds -attempt<N> to the name, because an
# artifact name can only be used once per run.
# =====================================================================
jobs:
  - job: SecretScan
    displayName: gitleaks - secrets in git history
    steps:
      - checkout: self
        fetchDepth: 0          # full history: a secret deleted later is still a leak

      - bash: |
          set -euo pipefail
          mkdir -p "$(Build.ArtifactStagingDirectory)/gitleaks"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$(Build.SourcesDirectory):/repo" \
            -v "$(Build.ArtifactStagingDirectory)/gitleaks:/out" \
            $(gitleaksImage) git /repo \
              --redact --no-banner \
              --gitleaks-ignore-path /repo/.gitleaksignore \
              --report-format sarif --report-path /out/gitleaks.sarif
        displayName: Scan history for secrets (fails on any leak)

      - template: report-artifact-name.yml
        parameters:
          name: gitleaks-report

      - task: PublishPipelineArtifact@1
        displayName: Publish gitleaks report
        condition: succeededOrFailed()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/gitleaks
          artifact: $(reportArtifact)

  - job: TrivyFilesystem
    displayName: Trivy - dependencies and IaC (report only)
    steps:
      - checkout: self

      # Scan once to JSON, then convert it to the other formats (no rescan)
      - bash: |
          set -euo pipefail
          mkdir -p "$(Build.ArtifactStagingDirectory)/trivy-fs"
          trivy() {
            docker run --rm \
              -v "$(Build.SourcesDirectory):/repo:ro" \
              -v "$(Build.ArtifactStagingDirectory)/trivy-fs:/out" \
              $(trivyImage) "$@"
          }
          # --offline-scan: don't download parent POMs from Maven Central,
          # which rate-limits the shared Microsoft-hosted agent IPs (HTTP 429)
          trivy fs /repo \
            --scanners vuln,misconfig --offline-scan \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs /repo/customer-portal/node_modules,/repo/admin-portal/node_modules \
            --format json --output /out/trivy-fs.json
          trivy convert --format template --template "@/contrib/junit.tpl" --output /out/trivy-fs-junit.xml /out/trivy-fs.json
          trivy convert --format template --template "@/contrib/html.tpl" --output /out/trivy-fs.html /out/trivy-fs.json
          trivy convert --format table --output /out/trivy-fs.txt /out/trivy-fs.json
          cat "$(Build.ArtifactStagingDirectory)/trivy-fs/trivy-fs.txt"
        displayName: Scan dependencies and IaC files

      - task: PublishTestResults@2
        displayName: Publish Trivy filesystem results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: $(Build.ArtifactStagingDirectory)/trivy-fs/trivy-fs-junit.xml
          testRunTitle: Trivy filesystem scan (report only)
          failTaskOnFailedTests: false

      - template: report-artifact-name.yml
        parameters:
          name: trivy-fs-report

      - task: PublishPipelineArtifact@1
        displayName: Publish Trivy filesystem report
        condition: succeededOrFailed()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/trivy-fs
          artifact: $(reportArtifact)
