# nginx for the single-page app. Runs as a non-root user on port 8080
# (nginxinc/nginx-unprivileged).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Probes for Docker / Kubernetes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Generated at container start by 40-runtime-config.sh - never cached,
    # so a new deployment's settings apply immediately
    location = /config.js {
        alias /tmp/runtime/config.js;
        default_type application/javascript;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Fingerprinted build assets can be cached for a year
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so users get new releases
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/dashboard, /auth/callback, ...) all serve index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
