# =====================================================================
# CREDPAY User Service - application configuration
# =====================================================================
# Every value with ${NAME:default} can be overridden by an environment
# variable; the defaults are for local development (infra/docker-compose.yml).
# =====================================================================

spring.application.name=user-service
server.port=8080

# ---------------------------------------------------------------------
# PostgreSQL datasource (existing 'credpay' database)
# Same DB_* environment variables as payment-service; the defaults match
# infra/docker-compose.yml for local development.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credpay}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------
# Flyway owns the schema (src/main/resources/db/migration).
# baseline-on-migrate: a database created earlier by schema.sql is
# recorded as version 1 and only receives V2 onwards.
# ---------------------------------------------------------------------
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------------------------------------------------------------------
# JPA / Hibernate - validate the entities against the Flyway schema,
# never change it.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
# SQL logging off by default (noisy, and it would log customer data);
# set SQL_ECHO=true when debugging queries locally.
spring.jpa.show-sql=${SQL_ECHO:false}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------------
# CORS - browser origins allowed to call this service: the customer
# portal (5173) and the admin portal (5174) in local dev.
# Comma-separated, override per environment.
# ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ---------------------------------------------------------------------
# Security - Keycloak access tokens (JWT). The issuer must match the
# token's "iss" claim exactly; the signing keys are fetched from it.
# Only tokens issued for the CredPay APIs (aud=credpay-api) are accepted.
#
# In a container the issuer's public URL may not be reachable; then set
# SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI to Keycloak's
# internal certs URL. The issuer is still checked against issuer-uri.
# (Not defined here: an empty jwk-set-uri would switch that mode on.)
# ---------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8081/realms/credpay}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE:credpay-api}

# ---------------------------------------------------------------------
# Actuator / Prometheus metrics (observability/application-metrics/)
# Exposes GET /actuator/prometheus - only 'health' and 'prometheus' are
# exposed, not the full actuator surface (no /actuator/env, /actuator/beans, etc).
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
# /actuator/health/liveness and /actuator/health/readiness for Kubernetes probes
management.endpoint.health.probes.enabled=true
# Without this, http.server.requests only exports count/sum/max - no
# histogram buckets, so PromQL's histogram_quantile() has nothing to work with.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
